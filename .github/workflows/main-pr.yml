# .github/workflows/main-pr.yml

name: Main pr validate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

# Cancel an in-flight validation when the PR gets new commits.
concurrency:
  group: ai-dev-platform-validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-dev-platform-ci:
    uses: MagmaOps/k3s-lab-ci/.github/workflows/ai-dev-platform-validate.yaml@main
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  # Single check for the branch ruleset: red if any validation job failed or was skipped.
  # Require "Validate" instead of the individual ai-dev-platform-ci / * checks, so adding
  # or renaming jobs in k3s-lab-ci never needs a ruleset change.
  validate:
    name: Validate
    needs: ai-dev-platform-ci
    if: ${{ always() }}
    runs-on: arc-runners
    steps:
      - name: Require all validation jobs to pass
        env:
          RESULT: ${{ needs.ai-dev-platform-ci.result }}
        run: |
          echo "validation result: $RESULT"
          [ "$RESULT" = "success" ]
